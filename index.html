<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Horarios de la Línea 544 de Empresa A. Buttini (San Rafael, Mendoza) — Invierno 2026."
    />
    <meta name="theme-color" content="#0B1A2E" />
    <script>
      // Applies the stored appearance before first paint, so a dark session never
      // flashes light. ThemeProvider re-applies the same attribute on mount.
      (function () {
        try {
          var stored = localStorage.getItem("colectivo-544:theme");
          var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored === "dark" || (stored !== "light" && prefersDark);
          document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
        } catch (error) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <title>Colectivo 544 — Horarios</title>
    <link rel="icon" href="/images/favicon/favicon.ico" sizes="any" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/images/favicon/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/images/favicon/favicon-16x16.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/images/favicon/apple-touch-icon.png"
    />
    <link rel="manifest" href="/images/favicon/site.webmanifest" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
